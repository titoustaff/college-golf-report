const map=L.map('map',{scrollWheelZoom:true}).setView([39.5,-98.35],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const heat=n=>n>=5?'#a3372a':n>=3?'#bd6a26':n>=1?'#3f7d52':'#8a9885';
const rad=sz=>sz?Math.max(5,Math.min(16,Math.sqrt(sz)/18)):6;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let markers=[];
const st={div:'all',senonly:false,intlonly:false,indooronly:false,nearonly:false,q:''};
const flag=p=>p.french?' 🇫🇷':(p.intl?' 🌍':'');
// criminalité déclarée sur le campus (Clery Act), rapportée à 1 000 étudiants
const cleryRate=t=>(t.cv==null||!t.size)?null:(t.cv+t.cp)/t.size*1000;
function clerytags(t){
  const out=[];
  if(t.setting) out.push(`<span class="tag">📍 ${esc(t.setting)}</span>`);
  if(t.resid) out.push(`<span class="tag">🏠 ${esc(t.resid)}</span>`);
  if(t.cv!=null){
    const r=cleryRate(t);
    const cls=r==null?'':(r<2?'ok':r<6?'warn':'bad');
    out.push(`<span class="tag ${cls}">🛡️ ${t.cv} atteintes aux personnes · ${t.cp} aux biens (campus, ${t.cy})`
      +(r!=null?` — ${r.toFixed(1)}/1000 étud.`:'')+`</span>`);
  }
  const p=(t.police||'').toLowerCase();
  if(p.includes('assermenté')||p.includes('police universitaire')||p.includes('pleins pouvoirs'))
    out.push('<span class="tag ok">👮 police universitaire assermentée</span>');
  else if(p.includes('non assermenté')||p.includes('pas de police')||p.includes('sous-trait'))
    out.push('<span class="tag warn">👮 sécurité non assermentée</span>');
  else if(p.includes('à vérifier')) out.push('<span class="tag">👮 dispositif à vérifier</span>');
  return out.join('');
}
function golftags(t){
  const out=[];
  if(t.course){
    // « sur le campus » = distance mesurée sous 1,2 km, ou marqué comme tel à la main
    const onsite = (t.course_km!=null && t.course_km<=1.2) || t.onsite==1;
    let d = onsite ? ' — sur le campus ou attenant'
          : (t.course_km!=null ? ` — ${t.course_km} km du campus` : ' — distance à vérifier');
    out.push(`<span class="tag ${onsite?'ok':''}">🏌️ ${esc(t.course)}${d}</span>`);
  } else out.push('<span class="tag">🏌️ parcours d\'attache à confirmer</span>');
  if((t.indoor||'').startsWith('Oui')) out.push('<span class="tag ok">🏠 golf indoor sur place</span>');
  return out.join('');
}
function showFiche(t){
  const dep=(t.players||[]).filter(p=>p.dep), intls=(t.players||[]).filter(p=>p.intl);
  const li=arr=>arr.map(p=>`<li><span class="yr">${p.year}</span>${esc(p.name)}${flag(p)} <span style="color:#8a9885;font-size:.8rem">${esc(p.hometown)}</span></li>`).join('')||'<li style="color:#8a9885">—</li>';
  document.getElementById('detail').innerHTML=`
    <h2>${t.site?`<a href="${t.site}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px dotted currentColor">${esc(t.name)}</a>`:esc(t.name)}<span class="chip">${t.division}</span></h2>
    <div class="meta">📍 ${esc(t.city)}, ${esc(t.state)}${t.conf?' · '+esc(t.conf):''}${t.size?' · 🏫 '+t.size.toLocaleString()+' étudiants':''}${t.coach?' · 🧑‍🏫 '+esc(t.coach):''}</div>
    <div class="tiles">
      <div class="t"><div class="n">${t.roster}</div><div class="l">joueurs</div></div>
      <div class="t"><div class="n" style="color:#a3372a">${t.seniors}</div><div class="l">départs 2027</div></div>
      <div class="t"><div class="n">${t.fr}·${t.so}·${t.jr}·${t.sr}</div><div class="l">Fr·So·Jr·Sr</div></div>
      <div class="t"><div class="n">🌍 ${t.intl}</div><div class="l">internationaux</div></div>
      ${t.french?`<div class="t"><div class="n">🇫🇷 ${t.french}</div><div class="l">français</div></div>`:''}
    </div>
    <div class="sec">🎓 Départs probables 2027 (${dep.length})</div><ul class="ros">${li(dep)}</ul>
    ${intls.length?`<div class="sec">🌍 Joueurs internationaux (${intls.length})</div><ul class="ros">${li(intls)}</ul>`:''}
    ${t.summary?`<div class="sec">🏫 Le campus</div><p class="txt">${esc(t.summary)}</p>`:''}
    ${t.ambiance?`<div class="sec">🎒 Ambiance &amp; vie étudiante</div><p class="txt">${esc(t.ambiance)}</p>`:''}
    <div class="sec">🛡️ Sécurité</div>
    <div>${clerytags(t)}</div>
    ${t.police?`<p class="txt">${esc(t.police)}</p>`:''}
    <div class="sec">⛳ Golf &amp; sport</div>
    <div>${golftags(t)}</div>
    ${t.course_note?`<p class="txt">${esc(t.course_note)}</p>`:''}
    ${t.indoor?`<p class="txt"><b>Indoor :</b> ${esc(t.indoor)}</p>`:''}
    ${t.gym?`<p class="txt"><b>Muscu / fitness :</b> ${esc(t.gym)}</p>`:''}
    ${t.facilities?`<p class="txt">${esc(t.facilities)}</p>`:''}
    <p style="margin-top:.8rem"><a class="r" href="${t.url}" target="_blank" rel="noopener">Voir le roster officiel ↗</a>${t.site?` &nbsp;·&nbsp; <a class="r" href="${t.site}" target="_blank" rel="noopener">Site de la fac ↗</a>`:''}</p>
    ${(t.sources&&t.sources.length)?`<div class="src">Sources : ${t.sources.map(u=>`<a href="${u}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,'').slice(0,60))}</a>`).join(' · ')}</div>`:''}`;
  document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function draw(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  const q=st.q.toLowerCase();
  DATA.filter(t=>(st.div=='all'||t.division==st.div)&&(!st.senonly||t.seniors>=3)&&(!st.intlonly||t.intl>0)
    &&(!st.indooronly||(t.indoor||'').startsWith('Oui'))
    &&(!st.nearonly||(t.course_km!=null&&t.course_km<=10))
    &&(!q||t.name.toLowerCase().includes(q)||(t.city||'').toLowerCase().includes(q)||(t.conf||'').toLowerCase().includes(q)))
   .forEach(t=>{
     const m=L.circleMarker([t.lat,t.lon],{radius:rad(t.size),fillColor:heat(t.seniors),color:'#0006',weight:1,fillOpacity:.85});
     m.bindTooltip(t.name);
     m.on('click',()=>showFiche(t));
     m.addTo(map); markers.push(m);
   });
}
document.getElementById('divseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.div=b.dataset.div;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x==b));draw();});
document.getElementById('senonly').addEventListener('change',e=>{st.senonly=e.target.checked;draw();});
document.getElementById('intlonly').addEventListener('change',e=>{st.intlonly=e.target.checked;draw();});
document.getElementById('indooronly').addEventListener('change',e=>{st.indooronly=e.target.checked;draw();});
document.getElementById('nearonly').addEventListener('change',e=>{st.nearonly=e.target.checked;draw();});
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;draw();});
draw();
// arrivée depuis la page liste : carte.html?fac=<nom> -> on centre et on ouvre la fiche
(function(){
  const want=new URLSearchParams(location.search).get('fac')||decodeURIComponent(location.hash.slice(1));
  if(!want) return;
  const t=DATA.find(x=>x.name===want)||DATA.find(x=>x.name.toLowerCase()===want.toLowerCase());
  if(!t) return;
  document.getElementById('q').value=t.name; st.q=t.name; draw();   // n'affiche que cette fac
  map.setView([t.lat,t.lon],11);
  showFiche(t);
  const m=markers[0]; if(m&&m.openTooltip) m.openTooltip();
})();
</script></body></html>
