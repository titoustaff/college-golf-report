const map=L.map('map',{scrollWheelZoom:true}).setView([39.5,-98.35],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const heat=n=>n>=5?'#a3372a':n>=3?'#bd6a26':n>=1?'#3f7d52':'#8a9885';
const rad=sz=>sz?Math.max(5,Math.min(16,Math.sqrt(sz)/18)):6;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let markers=[];
const st={div:'all',senonly:false,intlonly:false,q:''};
const flag=p=>p.french?' 🇫🇷':(p.intl?' 🌍':'');
function showFiche(t){
  const dep=(t.players||[]).filter(p=>p.dep), intls=(t.players||[]).filter(p=>p.intl);
  const li=arr=>arr.map(p=>`<li><span class="yr">${p.year}</span>${esc(p.name)}${flag(p)} <span style="color:#8a9885;font-size:.8rem">${esc(p.hometown)}</span></li>`).join('')||'<li style="color:#8a9885">—</li>';
  document.getElementById('detail').innerHTML=`
    <h2>${esc(t.name)}<span class="chip">${t.division}</span></h2>
    <div class="meta">📍 ${esc(t.city)}, ${esc(t.state)}${t.conf?' · '+esc(t.conf):''}${t.size?' · 🏫 '+t.size.toLocaleString()+' étudiants':''}${t.coach?' · 🧑‍🏫 '+esc(t.coach):''}</div>
    <div class="tiles">
      <div class="t"><div class="n">${t.roster}</div><div class="l">joueurs</div></div>
      <div class="t"><div class="n" style="color:#a3372a">${t.seniors}</div><div class="l">départs 2027</div></div>
      <div class="t"><div class="n">${t.fr}·${t.so}·${t.jr}·${t.sr}</div><div class="l">Fr·So·Jr·Sr</div></div>
      <div class="t"><div class="n">🌍 ${t.intl}</div><div class="l">internationaux</div></div>
      ${t.french?`<div class="t"><div class="n">🇫🇷 ${t.french}</div><div class="l">français</div></div>`:''}
    </div>
    <div class="sec">🎓 Départs probables 2027 (${dep.length})</div><ul class="ros">${li(dep)}</ul>
    ${intls.length?`<div class="sec">🌍 Joueurs internationaux (${intls.length})</div><ul class="ros">${li(intls)}</ul>`:''}
    <div class="sec">🏌️ Infrastructures &amp; notes</div>
    <p class="todo">${t.facilities?esc(t.facilities):'À compléter (practice indoor, simulateur, muscu, parcours d\'attache…) — saisie manuelle à venir.'}</p>
    <p style="margin-top:.8rem"><a class="r" href="${t.url}" target="_blank" rel="noopener">Voir le roster officiel ↗</a></p>`;
  document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function draw(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  const q=st.q.toLowerCase();
  DATA.filter(t=>(st.div=='all'||t.division==st.div)&&(!st.senonly||t.seniors>=3)&&(!st.intlonly||t.intl>0)
    &&(!q||t.name.toLowerCase().includes(q)||(t.city||'').toLowerCase().includes(q)||(t.conf||'').toLowerCase().includes(q)))
   .forEach(t=>{
     const m=L.circleMarker([t.lat,t.lon],{radius:rad(t.size),fillColor:heat(t.seniors),color:'#0006',weight:1,fillOpacity:.85});
     m.bindTooltip(t.name);
     m.on('click',()=>showFiche(t));
     m.addTo(map); markers.push(m);
   });
}
document.getElementById('divseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.div=b.dataset.div;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x==b));draw();});
document.getElementById('senonly').addEventListener('change',e=>{st.senonly=e.target.checked;draw();});
document.getElementById('intlonly').addEventListener('change',e=>{st.intlonly=e.target.checked;draw();});
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;draw();});
draw();
</script></body></html>
